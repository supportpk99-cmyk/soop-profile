-<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>빡쏘 방송국 프로필</title>
    <!-- Tailwind CSS CDN (빠르고 예쁜 디자인 적용) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* 버건디 시그니처 테마 컬러 */
        .bg-burgundy { background-color: #6b1d2f; }
        .text-burgundy { color: #6b1d2f; }
        .border-burgundy { border-color: #6b1d2f; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center p-6">

    <!-- 상단 프로필 헤더 -->
    <div class="w-full max-w-2xl bg-gray-800 rounded-2xl shadow-xl p-6 mb-6 border border-burgundy">
        <div class="flex items-center space-x-4">
            <div class="w-20 h-20 bg-burgundy rounded-full flex items-center justify-center text-2xl font-bold">
                빡쏘
            </div>
            <div>
                <h1 id="bj-title" class="text-2xl font-bold">로딩 중...</h1>
                <p class="text-gray-400 text-sm mt-1">도파민에 살고 죽는 버츄얼 스트리머 빡쏘</p>
            </div>
        </div>
    </div>

    <!-- 메인 컨텐츠 영역 (공지 및 일정) -->
    <div class="w-full max-w-2xl grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- 방송 공지 -->
        <div class="bg-gray-800 rounded-2xl p-6 shadow-lg border border-gray-700">
            <h2 class="text-lg font-semibold mb-3 text-burgundy">📢 방송 공지</h2>
            <div id="notice-box" class="text-sm text-gray-300">
                데이터를 불러오는 중입니다...
            </div>
        </div>

        <!-- 방송 일정 (캘린더) -->
        <div class="bg-gray-800 rounded-2xl p-6 shadow-lg border border-gray-700">
            <h2 class="text-lg font-semibold mb-3 text-burgundy">📅 방송 일정</h2>
            <div id="schedule-box" class="text-sm text-gray-300">
                등록된 일정이 없습니다.
            </div>
        </div>
    </div>

    <script>
        // 백엔드 API에서 데이터 불러오기 (본인 SOOP ID 입력)
        const bjId = 'soop_id_here'; // 나중에 본인 SOOP 아이디로 수정 가능

        fetch(`/api/soop?bj_id=${bjId}`)
            .then(res => res.json())
            .then(response => {
                if (response.data) {
                    const info = response.data;
                    document.getElementById('bj-title').innerText = info.broadcasterName || '빡쏘 방송국';
                    document.getElementById('notice-box').innerText = '최신 공지 데이터를 연동하는 중입니다.';
                }
            })
            .catch(err => {
                console.error(err);
                document.getElementById('bj-title').innerText = '빡쏘 방송국';
                document.getElementById('notice-box').innerText = '데이터를 불러오지 못했습니다.';
            });
    </script>
</body>
</html>
